账号受限怎么办: Xử lý tài khoản bị hạn chế
本地操作不删除服务端记录，也不保证匿名或账号可用。: Thao tác cục bộ không xóa bản ghi phía máy chủ, cũng không bảo đảm tính ẩn danh hoặc khả năng sử dụng tài khoản.
绿色结果仅表示本次已测项目匹配；DNS 和 WebRTC 需另行检查。: Kết quả màu xanh chỉ cho biết các mục đã kiểm tra lần này khớp yêu cầu. Cần kiểm tra DNS và WebRTC riêng.
账号使用仍须遵守 Anthropic 的条款和支持地区要求。: Việc sử dụng tài khoản vẫn phải tuân thủ điều khoản của Anthropic và yêu cầu về khu vực được hỗ trợ.
密码、密钥和令牌不要放进公开日志或仓库。: Không đưa mật khẩu, khóa và mã thông báo vào nhật ký hoặc kho mã công khai.
