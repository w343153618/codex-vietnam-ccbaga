选择 AI 工具，复制提示词并交给它安装 Skill。: Chọn công cụ AI, sao chép câu lệnh nhắc và giao cho công cụ đó cài đặt Skill.
连接资料交给 AI；远端部署前由你确认。: Cung cấp thông tin kết nối cho AI; bạn xác nhận trước khi triển khai từ xa.
