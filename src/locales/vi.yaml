本软件仅供旅居人员管理本人的 Claude 身份，禁止用于违反 Anthropic 官方用户协议的行为。: Phần mềm này chỉ dành cho người cư trú hoặc đi lại ở nước ngoài để quản lý danh tính Claude của chính mình. Nghiêm cấm sử dụng để vi phạm điều khoản sử dụng chính thức của Anthropic.
